name: tigerit

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host access for tools like pgAdmin/DBeaver. Remove to keep the DB private.
      - "${DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./tiger_backend-master
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the database is reached by its service name
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - agent_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: ./tiger_frontend-master
      args:
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    restart: unless-stopped
    volumes:
      - static_files:/srv/static:ro
      - media_files:/srv/media:ro
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"   # web app
      - "${BACKEND_PORT:-8000}:8000"  # API + Django admin

volumes:
  postgres_data:
  static_files:
  media_files:
  agent_data:
